spring.application.name=testTruper

# Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/testtruper?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin_app
spring.datasource.password=Admin123

# Connection pool settings (optional, but recommended)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings (optional for Spring Data JPA)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Logging SQL Queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE